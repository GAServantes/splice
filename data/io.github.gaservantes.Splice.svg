    <line x1="51" y1="79" x2="51" y2="96"/><line x1="58" y1="82" x2="58" y2="93"/>
    <line x1="72" y1="81" x2="72" y2="94"/><line x1="79" y1="84" x2="79" y2="91"/><line x1="86" y1="80" x2="86" y2="95"/>
