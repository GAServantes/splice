name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sh tests/install_ci_deps.sh
      - name: Lint and tests (no GPU, headless)
        run: tests/run_ci.sh
